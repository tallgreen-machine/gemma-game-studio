<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL-SPACE: Epiphany Dashboard</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: #1a1a24;
            --text-main: #e2e2e2;
            --text-dim: #8b8b9b;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.2);
            --border: #2a2a35;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 1fr 180px;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
            overflow: hidden; /* Prevents whole window from scrolling */
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Logs Panel */
        #logs-panel {
            grid-column: 1;
            grid-row: 1;
        }

        #terminal {
            flex: 1;
            background-color: #000;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #50fa7b; /* Dracul-style green */
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.05);
        }

        .log-header { color: #bd93f9; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; border-bottom: 1px solid rgba(189, 147, 249, 0.3); }
        .log-cmd { color: #f1fa8c; }
        .log-err { color: #ff5555; font-weight: bold; }
        .log-info { color: #8be9fd; }

        /* Chat Panel */
        #chat-panel {
            grid-column: 2;
            grid-row: 1;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg-human {
            background-color: #2b2b36;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-agent {
            background-color: var(--accent-glow);
            border: 1px solid var(--accent);
            color: var(--accent);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* Media Panel */
        #media-panel {
            grid-column: 1 / span 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
        }

        #media-gallery {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            flex: 1;
            align-items: center;
        }

        .media-item {
            height: 100px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .chat-input-container {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            background-color: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 0 20px;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button:active {
            transform: scale(0.98);
        }

        h2 {
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--panel-bg);
            margin: 5% auto;
            padding: 30px;
            border: 1px solid var(--accent);
            width: 80%;
            max-width: 900px;
            height: 70vh;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            background: #000;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            white-space: pre-wrap;
            line-height: 1.6;
            color: #ccc;
        }

        .tab-btns {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            padding: 8px 15px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 4px;
        }

        .tab-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
        }

        .close-btn {
            color: var(--text-dim);
            font-size: 28px;
            cursor: pointer;
        }

        .close-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="panel" id="logs-panel">
        <div class="header-row">
            <h2>Live Mac Supervisor Logs</h2>
            <button id="intel-btn" style="padding: 5px 12px; font-size: 12px; background: transparent; border: 1px solid var(--accent); color: var(--accent);">PROJECT INTEL</button>
        </div>
        <div id="terminal">System Initialized. Waiting for connection...
</div>
    </div>

    <div class="panel" id="chat-panel">
        <div class="header-row">
            <h2>Agent Communications</h2>
            <button id="clear-btn" style="padding: 5px 12px; font-size: 12px; background: transparent; border: 1px solid #ff5555; color: #ff5555;">CLEAR HISTORY</button>
        </div>
        <div id="chat-history">
            <div class="msg msg-agent">Gemma 4 is online. Epiphany Link established.</div>
        </div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Give an instruction..." autocomplete="off">
            <button id="send-btn">SEND</button>
        </div>
    </div>

    <div class="panel" id="media-panel">
        <h2>Observation Deck (Screenshots)</h2>
        <div id="media-gallery">
            <!-- Screenshots appear here -->
        </div>
    </div>

    <!-- Modal -->
    <div id="intel-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="tab-btns">
                    <button class="tab-btn active" id="tab-manifesto">PRIME DIRECTIVE</button>
                    <button class="tab-btn" id="tab-journal">PROJECT JOURNAL</button>
                </div>
                <span class="close-btn" id="close-modal">&times;</span>
            </div>
            <div class="modal-body" id="modal-text">Loading...</div>
        </div>
    </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const chatHistory = document.getElementById('chat-history');
        const mediaGallery = document.getElementById('media-gallery');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');

        // Connect WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        
        let ws;
        function connect() {
            ws = new WebSocket(wsUrl);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'log') {
                    const line = document.createElement('div');
                    const text = data.text;
                    
                    if (text.includes('--- Starting Iteration')) {
                        line.className = 'log-header';
                    } else if (text.startsWith('Executing Natively:')) {
                        line.className = 'log-cmd';
                    } else if (text.includes('ERROR') || text.includes('failed') || text.includes('Error')) {
                        line.className = 'log-err';
                    } else if (text.startsWith('Native Result:')) {
                        line.className = 'log-info';
                    } else if (text.startsWith('Querying Gemma 4')) {
                        line.style.color = '#ffb86c'; // Orange
                        line.style.fontStyle = 'italic';
                    } else if (text.startsWith('Gemma 4 Output:')) {
                        line.style.color = '#f8f8f2';
                        line.style.borderLeft = '2px solid var(--accent)';
                        line.style.paddingLeft = '10px';
                        line.style.marginTop = '10px';
                    }
                    
                    line.textContent = text;
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                } else if (data.type === 'agent_chat') {
                    appendMessage(data.text, 'msg-agent');
                } else if (data.type === 'screenshot') {
                    const img = document.createElement('img');
                    img.src = data.url;
                    img.className = 'media-item';
                    img.onclick = () => window.open(data.url, '_blank');
                    mediaGallery.appendChild(img);
                    mediaGallery.scrollLeft = mediaGallery.scrollWidth;
                }
            };
            
            ws.onclose = () => {
                setTimeout(connect, 2000);
            };
        }
        connect();

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function loadChatHistory() {
            try {
                const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
                const res = await fetch(`${protocol}//${window.location.host}/api/chat/history`, {
                    headers: {"X-API-KEY": "epiphany_secret_2026"}
                });
                if (res.ok) {
                    const data = await res.json();
                    chatHistory.innerHTML = ''; // Clear default message
                    data.history.forEach(msg => {
                        const className = msg.sender === 'human' ? 'msg-human' : 'msg-agent';
                        appendMessage(msg.message, className);
                    });
                    if (data.history.length === 0) {
                        appendMessage("Gemma 4 is online. Epiphany Link established.", "msg-agent");
                    }
                }
            } catch (err) {
                console.error("Failed to load chat history:", err);
            }
        }
        loadChatHistory();

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'msg-human');
            
            // Send via WS to droplet queue
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'chat', text: text }));
            }

            chatInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        clearBtn.onclick = async () => {
            if (!confirm("Clear all chat history? This will also reset Gemma's current context.")) return;
            try {
                const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
                const res = await fetch(`${protocol}//${window.location.host}/api/chat/history`, {
                    method: 'DELETE',
                    headers: {"X-API-KEY": "epiphany_secret_2026"}
                });
                if (res.ok) {
                    chatHistory.innerHTML = '';
                    appendMessage("Conversation cleared. Context reset.", "msg-agent");
                }
            } catch (err) {
                console.error("Failed to clear history:", err);
            }
        }

        // Modal Logic
        const modal = document.getElementById('intel-modal');
        const intelBtn = document.getElementById('intel-btn');
        const closeModal = document.getElementById('close-modal');
        const modalText = document.getElementById('modal-text');
        const tabManifesto = document.getElementById('tab-manifesto');
        const tabJournal = document.getElementById('tab-journal');

        intelBtn.onclick = () => {
            modal.style.display = "block";
            fetchContent('/api/manifesto');
        }

        closeModal.onclick = () => modal.style.display = "none";
        window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; }

        async function fetchContent(url) {
            modalText.textContent = "Loading...";
            try {
                const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
                const res = await fetch(`${protocol}//${window.location.host}${url}`, {
                    headers: {"X-API-KEY": "epiphany_secret_2026"}
                });
                const data = await res.json();
                modalText.textContent = data.content || "No content found.";
            } catch (err) {
                modalText.textContent = "Error loading content.";
            }
        }

        tabManifesto.onclick = () => {
            tabManifesto.classList.add('active');
            tabJournal.classList.remove('active');
            fetchContent('/api/manifesto');
        }

        tabJournal.onclick = () => {
            tabJournal.classList.add('active');
            tabManifesto.classList.remove('active');
            fetchContent('/api/journal');
        }
    </script>
</body>
</html>
