<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma 4 Epiphany Dashboard</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: #1a1a24;
            --text-main: #e2e2e2;
            --text-dim: #8b8b9b;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.2);
            --border: #2a2a35;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* Logs Panel */
        #logs-panel {
            flex: 2;
        }

        #terminal {
            flex: 1;
            background-color: #000;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #00ff00;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.05);
        }

        /* Chat Panel */
        #chat-panel {
            flex: 1;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg-human {
            background-color: #2b2b36;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-agent {
            background-color: var(--accent-glow);
            border: 1px solid var(--accent);
            color: var(--accent);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* Media Gallery */
        #media-gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
            min-height: 120px;
            border-bottom: 1px solid var(--border);
        }

        .media-item {
            height: 100px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .media-item:hover {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            background-color: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 0 20px;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button:active {
            transform: scale(0.98);
        }

        h2 {
            margin-top: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="panel" id="logs-panel">
        <h2>Live Mac Supervisor Logs</h2>
        <div id="terminal">System Initialized. Waiting for connection...
</div>
    </div>

    <div class="panel" id="chat-panel">
        <h2>Agent Communications</h2>
        <div id="chat-history">
            <div class="msg msg-agent">Gemma 4 is online. Epiphany Link established.</div>
        </div>
        <div id="media-gallery">
            <!-- Screenshots appear here -->
        </div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Give an instruction or pivot command..." autocomplete="off">
            <button id="send-btn">SEND</button>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const chatHistory = document.getElementById('chat-history');
        const mediaGallery = document.getElementById('media-gallery');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        // Connect WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        
        let ws;
        function connect() {
            ws = new WebSocket(wsUrl);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'log') {
                    terminal.textContent += data.text + '\n';
                    terminal.scrollTop = terminal.scrollHeight;
                } else if (data.type === 'agent_chat') {
                    appendMessage(data.text, 'msg-agent');
                } else if (data.type === 'screenshot') {
                    const img = document.createElement('img');
                    img.src = data.url;
                    img.className = 'media-item';
                    img.onclick = () => window.open(data.url, '_blank');
                    mediaGallery.appendChild(img);
                    mediaGallery.scrollLeft = mediaGallery.scrollWidth;
                }
            };
            
            ws.onclose = () => {
                setTimeout(connect, 2000);
            };
        }
        connect();

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function loadChatHistory() {
            try {
                const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
                const res = await fetch(`${protocol}//${window.location.host}/api/chat/history`, {
                    headers: {"X-API-KEY": "epiphany_secret_2026"}
                });
                if (res.ok) {
                    const data = await res.json();
                    chatHistory.innerHTML = ''; // Clear default message
                    data.history.forEach(msg => {
                        const className = msg.sender === 'human' ? 'msg-human' : 'msg-agent';
                        appendMessage(msg.message, className);
                    });
                    if (data.history.length === 0) {
                        appendMessage("Gemma 4 is online. Epiphany Link established.", "msg-agent");
                    }
                }
            } catch (err) {
                console.error("Failed to load chat history:", err);
            }
        }
        loadChatHistory();

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'msg-human');
            
            // Send via WS to droplet queue
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'chat', text: text }));
            }

            chatInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
